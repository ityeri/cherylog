[project]
name = "cherylog"
version = "0.1.0"
description = "Universal log bot (hopefully)"
authors = [
    {name = "ityeri", email = "ityeri9@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "dependency-injector>=4.48.3",
    "discord>=2.3.2",
    "dotenv>=0.9.9",
    "fastapi>=0.129.0",
    "psycopg2-binary>=2.9.11",
    "sqlalchemy>=2.0.45",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"
